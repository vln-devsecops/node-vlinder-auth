---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # vitest and @vitest/coverage-v8 (packages/lambda-src) must stay on the
      # same major version -- coverage-v8 v4 requires vitest v4, so a lone
      # bump of either breaks the build. Grouping forces Dependabot to
      # propose both together in one PR instead of two independent ones.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    labels:
      - dependencies
      - npm
